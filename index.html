<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>藏光</title>
<meta name="description" content="像素风宝石切割增量游戏。敲开原石，用真实的折射角度把光锁在宝石里，从萤石一路切到钻石。">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- web fonts must never block first paint: Google Fonts is unreachable from mainland China, and a blocking sheet there means a blank page until timeout -->
<link rel="stylesheet" id="webfonts" media="print" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=ZCOOL+XiaoWei&display=swap">
<style>
/* Layout: one crystallography plate. A double-ruled frame holds the specimen (the gem being cut) with leader-line callouts,
   a legend column for rough stones and the workshop, and a row of figures for the display case. */
:root {
  --bg: #e7ebeb;          /* cool chalk plate paper, never cream */
  --surface: #eef1f1;
  --sunk: #dde2e3;
  --ink: #1b2230;         /* blue-black engraving ink */
  --muted: #4b5566;       /* secondary ink */
  --line: #b4bcc2;        /* hairline */
  --accent: #2e43a6;      /* ultramarine wash for prompts */
  --shadow: #c4cacd;      /* caustic shadow under the specimen */
  --good: #2a7a4c;
  --bad: #a3263a;
  --f-display: "Old Standard TT", "ZCOOL XiaoWei", "Songti SC", "STSong", serif;
  --f-body: "Old Standard TT", "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-num: "Old Standard TT", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #171c25; --sunk: #0e1117; --ink: #dfe4ea; --muted: #9ba6b5; --line: #2f3744;
    --accent: #93a6ff; --shadow: #232a35; --good: #79d39f; --bad: #ff8e9b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #171c25; --sunk: #0e1117; --ink: #dfe4ea; --muted: #9ba6b5; --line: #2f3744;
  --accent: #93a6ff; --shadow: #232a35; --good: #79d39f; --bad: #ff8e9b; color-scheme: dark;
}
:root[lang="en"] { --f-body: "Old Standard TT", Georgia, "Times New Roman", serif; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.6; scrollbar-color: var(--line) transparent; }
:root[lang="en"] body { font-size: 16px; }
::selection { background: var(--gem, var(--accent)); color: var(--bg); }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

.app {
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  display: flex; flex-direction: column; gap: 14px;
}
/* the plate: outer 2px rule, 4px gap, inner hairline. These three weights are the only lines on the page. */
.plate { border: 2px solid var(--ink); padding: 4px; }
.plate-in { border: 1px solid var(--ink); padding: clamp(14px, 1.8vw, 22px) clamp(14px, 2.4vw, 28px); display: flex; flex-direction: column; gap: clamp(12px, 1.6vw, 18px); }

.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px 16px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
.plate-no { font-family: var(--f-display); font-size: 15px; letter-spacing: .14em; color: var(--muted); align-self: start; }
.brand { text-align: center; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 3.6vw, 46px); line-height: 1; margin: 0; letter-spacing: .18em; text-indent: .18em; }
:root[lang="en"] .brand h1 { letter-spacing: .08em; text-indent: .08em; }
.brand p { margin: 4px auto 0; color: var(--muted); font-style: italic; max-width: 60ch; text-wrap: balance; line-height: 1.45; }
.meter { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.meter-row { display: flex; align-items: baseline; gap: 8px; }
.meter .lbl { font-family: var(--f-display); font-size: 15px; letter-spacing: .14em; color: var(--muted); }
.meter .num { font-family: var(--f-num); font-size: clamp(30px, 3.4vw, 40px); line-height: 1; white-space: nowrap; }
/* digits sit in fixed cells so the count never shoves the layout */
.num .d { display: inline-block; width: .58em; text-align: center; }
.num .p { display: inline-block; width: .28em; text-align: center; }
.num .w { display: inline-block; width: 1em; text-align: center; font-family: var(--f-display); font-size: .7em; }
.meter .rate { font-family: var(--f-num); font-style: italic; font-size: 14px; color: var(--muted); }
.meter .toggles { display: flex; gap: 6px; }

.grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 0; align-items: start; }
.grid > .bench { padding-right: clamp(16px, 2.4vw, 32px); position: sticky; top: calc(16px + var(--rh, 0px)); transition: top .35s cubic-bezier(.16, 1, .3, 1); }
.grid > .side { padding-left: clamp(16px, 2.4vw, 32px); border-left: 1px solid var(--line); }
.case { border-top: 1px solid var(--ink); padding-top: 14px; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 17px; letter-spacing: .16em; margin: 0 0 6px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
:root[lang="en"] h2 { font-variant: small-caps; letter-spacing: .1em; font-size: 19px; }
h2 small { font-family: var(--f-body); font-size: 13px; letter-spacing: 0; color: var(--muted); font-style: italic; font-variant: normal; }

/* specimen with leader-line callouts */
.bench { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.specimen { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; }
.callouts { display: flex; flex-direction: column; gap: 34px; }
.callout { display: flex; align-items: center; gap: 8px; min-width: 0; }
.callout .cv { display: flex; flex-direction: column; line-height: 1.2; }
.callout .cl { font-size: 12px; color: var(--muted); letter-spacing: .06em; white-space: nowrap; }
.callout b { font-family: var(--f-num); font-weight: 400; font-size: 20px; white-space: nowrap; }
.callout .lead { flex: 1; min-width: 16px; height: 1px; background: var(--ink); opacity: .55; position: relative; }
.callout .lead::after { content: ""; position: absolute; top: -2px; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
.callouts.l .lead::after { right: -2px; }
.callouts.l .callout { flex-direction: row; text-align: right; }
.callouts.l .cv { align-items: flex-end; }
.callouts.r .lead::after { left: -2px; }
.specimen.empty .callouts { visibility: hidden; }
.stage-wrap { position: relative; display: flex; justify-content: center; }
.stage-box { position: relative; margin: -8px auto -4px; max-width: 100%; }
/* the empty bench is drawn like an empty case slot, so the blank space reads as a free place, not a broken page */
.specimen.empty .stage-box::after { content: ""; position: absolute; left: 50%; top: 46%; width: 38%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 1px dashed var(--line); border-radius: 50%; pointer-events: none; }
/* the hand-tint wash: deepens with every facet */
.wash {
  /* centred on the gem itself: the sprite's centre sits at y 56 of the 150px canvas */
  position: absolute; left: 50%; top: 37.3%; width: 72%; aspect-ratio: 1; transform: translate(-50%, -50%);
  pointer-events: none; opacity: 0; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--gem, transparent) 55%, transparent) 62%, var(--gem, transparent) 100%);
  filter: url(#washEdge); mix-blend-mode: multiply; transition: opacity .9s cubic-bezier(.16, 1, .3, 1);
}
:root[data-theme="dark"] .wash { mix-blend-mode: screen; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wash { mix-blend-mode: screen; } }
#benchCv {
  position: relative; display: block; margin: 0; width: clamp(200px, min(30vw, calc((100svh - 330px) * .853)), 400px); aspect-ratio: 128 / 150; max-width: 100%;
  image-rendering: pixelated; cursor: pointer; touch-action: manipulation; outline: none;
}
#benchCv:focus-visible { outline: 1px dashed var(--ink); outline-offset: -6px; }
#benchCv.idle { cursor: default; }

.caption { text-align: center; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; column-gap: .5em; row-gap: 2px; }
.caption > div:not(.gname) { flex-basis: 100%; }
.caption .fig { font-family: var(--f-num); font-style: italic; font-size: 17px; color: var(--muted); }
.gname { font-family: var(--f-display); font-size: 26px; line-height: 1.15; letter-spacing: .06em; padding-bottom: 4px; border-bottom: 2px solid var(--gem, var(--ink)); }
.gen { font-family: var(--f-num); font-style: italic; font-size: 15px; color: var(--muted); }
.gformula { font-family: var(--f-num); font-size: 15px; color: var(--ink); }
.specs { display: none; }

.status { display: flex; flex-direction: column; gap: 6px; }
.hint { font-size: 15px; text-align: center; text-wrap: balance; }
.bar { height: 3px; background: var(--line); position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--gem, var(--ink)); width: 0; transition: width .25s cubic-bezier(.16, 1, .3, 1); }
.bartext { font-family: var(--f-num); font-style: italic; font-size: 13px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.ticker { margin: 0; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; min-height: 3.2em; font-style: italic; }
.ticker.flash { color: var(--ink); }
.ticker:empty { display: none; }

/* angle scale */
.angle { display: flex; flex-direction: column; gap: 4px; }
.tap-tip {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%); pointer-events: none; white-space: nowrap; z-index: 2;
  background: var(--ink); color: var(--bg); font-family: var(--f-display); font-size: 15px; letter-spacing: .08em; padding: 4px 12px; animation: tipbob 1.1s cubic-bezier(.45, 0, .55, 1) infinite;
}
.tap-tip::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: var(--ink); }
.tap-tip.warn { background: var(--bad); color: var(--bg); }
.tap-tip.warn::after { border-top-color: var(--bad); }
/* running head: once the header counter scrolls away, a slim strip carries the title and the light count, like the head of a printed page */
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--rh, 0px)); }
.runhead {
  position: fixed; z-index: 15; inset: 0 0 auto; padding-top: env(safe-area-inset-top, 0px);
  background: var(--bg); border-bottom: 1px solid var(--ink);
  transform: translateY(-100%); visibility: hidden; transition: transform .35s cubic-bezier(.16, 1, .3, 1), visibility 0s .35s;
}
.runhead.on { transform: none; visibility: visible; transition: transform .35s cubic-bezier(.16, 1, .3, 1); }
.rh-in {
  max-width: 1200px; margin: 0 auto; padding-block: 5px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
}
.rh-title { font-family: var(--f-display); font-size: 15px; letter-spacing: .14em; color: var(--muted); white-space: nowrap; }
.rh-meter { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.rh-meter .lbl { font-family: var(--f-display); font-size: 13px; letter-spacing: .14em; color: var(--muted); }
.rh-meter .num { font-family: var(--f-num); font-size: 24px; line-height: 1.1; white-space: nowrap; }
.rh-meter .rate { font-family: var(--f-num); font-style: italic; font-size: 13px; color: var(--muted); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .runhead, .runhead.on, .grid > .bench { transition: none; } }
/* first unlock of a rough stone: a small plate card slides in, a hand-tint wash brushes across it */
.unlock {
  position: fixed; z-index: 30; left: 50%; top: calc(env(safe-area-inset-top, 0px) + var(--rh, 0px) + 14px); transform: translateX(-50%);
  display: flex; align-items: center; gap: 14px; padding: 8px 14px 8px 8px; width: max-content; max-width: calc(100vw - 32px);
  background: var(--bg); border: 2px solid var(--ink); outline: 1px solid var(--ink); outline-offset: -6px;
  box-shadow: 0 18px 40px -20px rgba(10, 14, 22, .55); animation: unlockIn .6s cubic-bezier(.16, 1, .3, 1);
}
.unlock::before { content: ""; position: absolute; inset: 6px; background: var(--gem, var(--accent)); opacity: .2; transform-origin: left; animation: tintIn 1.2s cubic-bezier(.16, 1, .3, 1) .15s both; }
.unlock > * { position: relative; }
.unlock canvas { width: 88px; height: 103px; margin-block: -10px; image-rendering: pixelated; }
.unlock .u-text { display: flex; flex-direction: column; min-width: 0; }
.unlock .u-text b { font-family: var(--f-display); font-weight: 400; font-size: 20px; letter-spacing: .04em; }
.unlock .u-text span { font-family: var(--f-num); font-style: italic; font-size: 13px; color: var(--muted); }
@keyframes unlockIn { from { transform: translate(-50%, -24px); opacity: 0; } }
@keyframes tintIn { from { transform: scaleX(0); } }
.row.fresh { animation: freshRow 2.4s cubic-bezier(.16, 1, .3, 1) 2; }
@keyframes freshRow { 0%, 35% { background: color-mix(in srgb, var(--gem) 22%, transparent); } 100% { background: transparent; } }
/* a gem arriving in the case: drops into its slot while the slot flashes its colour */
.slot.arrive { animation: slotGlow 1.8s cubic-bezier(.16, 1, .3, 1) .35s both; }
.slot.arrive canvas { animation: dropIn .75s cubic-bezier(.16, 1, .3, 1) .35s both; }
@keyframes slotGlow { 0%, 30% { background: color-mix(in srgb, var(--gem) 24%, transparent); } 100% { background: transparent; } }
@keyframes dropIn { from { transform: translateY(-48px) scale(1.35); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .unlock, .unlock::before, .row.fresh, .slot.arrive, .slot.arrive canvas { animation: none; } }
@keyframes tipbob { 50% { transform: translate(-50%, 5px); } }
button.pulse { animation: pulse 1.3s cubic-bezier(.16, 1, .3, 1) infinite; }
@keyframes pulse { 0% { outline: 1px solid var(--accent); outline-offset: 1px; } 100% { outline: 1px solid transparent; outline-offset: 9px; } }
.row.nudge { background: color-mix(in srgb, var(--accent) 9%, transparent); margin-inline: -10px; padding-inline: 10px; }
.nudge-note { display: none; font-size: 13px; color: var(--accent); font-style: italic; }
.row.nudge .nudge-note { display: inline; }
/* the buy button takes the placed gem's spot: it fades in and ignores taps for a beat, so a fast tapper can't buy by accident */
#benchBuyBtn.calm { animation: benchCalm .8s ease-out both; }
@keyframes benchCalm { 0%, 40% { opacity: 0; } 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .tap-tip, button.pulse, #benchBuyBtn.calm { animation: none; } .wash, .bar i { transition: none; } }
.gauge-tip { font-size: 15px; text-align: center; transition: color .15s; }
.gauge-tip.now { color: var(--accent); }
#gaugeCv { width: 100%; height: 70px; display: block; cursor: pointer; touch-action: manipulation; }
#angleCv { width: 100%; height: 250px; display: block; cursor: pointer; touch-action: manipulation; margin-top: 8px; }
.angle summary { font-size: 13px; color: var(--muted); cursor: pointer; width: fit-content; margin-inline: auto; font-style: italic; list-style: none; display: flex; align-items: center; gap: 8px; }
.angle summary::-webkit-details-marker { display: none; }
.angle summary::before { content: ""; border-left: 6px solid var(--muted); border-block: 4px solid transparent; transition: transform .2s cubic-bezier(.16, 1, .3, 1); }
.angle details[open] summary::before { transform: rotate(90deg); }
.angle details { padding-top: 4px; }
.readout { display: flex; gap: 6px 18px; flex-wrap: wrap; justify-content: center; font-size: 13px; color: var(--muted); }
.readout b { color: var(--ink); font-family: var(--f-num); font-weight: 400; font-size: 15px; }

/* buttons are engraved plate labels: a ruled box, small caps, no shadow */
button {
  font: inherit; font-size: 14px; color: var(--ink); background: transparent; border: 1px solid var(--ink);
  padding: 5px 12px; cursor: pointer; white-space: nowrap; border-radius: 0; letter-spacing: .04em;
  transition: background-color .15s, color .15s;
}
button:hover:not(:disabled) { background: var(--ink); color: var(--bg); }
button:active:not(:disabled) { background: var(--muted); }
button:disabled { color: var(--muted); border-color: var(--line); border-style: dashed; cursor: not-allowed; }
button.primary { background: var(--ink); color: var(--bg); }
button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
button b { font-family: var(--f-num); font-weight: 400; font-size: 15px; }
.meter .toggles button { font-size: 12px; padding: 2px 8px; }

/* legend */
.side { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.legend-sec { display: flex; flex-direction: column; }
.legend-sec h2 { padding-bottom: 6px; border-bottom: 1px solid var(--ink); margin-bottom: 0; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; gap: 8px 14px; justify-content: space-between; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.row:first-child { border-top: 0; }
.row-main { flex: 1 1 190px; min-width: 0; }
.row-title { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.row-title .nm { font-family: var(--f-display); font-size: 17px; letter-spacing: .03em; }
.row-title .sub { font-family: var(--f-num); font-size: 13px; color: var(--muted); font-style: italic; }
.row-desc { font-size: 13px; color: var(--muted); max-width: 60ch; }
.row-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.row.locked .nm { color: var(--muted); }

/* the display case is a row of figures */
.case-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); overflow: hidden; }
.slot { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 4px 8px 10px; gap: 1px; min-height: 186px; border-left: 1px solid var(--line); margin-left: -1px; }
.slot canvas { width: 100%; max-width: 124px; aspect-ratio: 128 / 150; image-rendering: pixelated; }
.slot .wipe { margin-top: 6px; min-height: 32px; padding: 2px 12px; font-size: 13px; }
.slot .wipe.off { visibility: hidden; }
.slot .cap { display: flex; gap: .4em; align-items: baseline; padding-bottom: 2px; border-bottom: 2px solid var(--gem, var(--line)); }
.slot .fig { font-family: var(--f-num); font-style: italic; font-size: 14px; color: var(--muted); }
.slot .sn { font-family: var(--f-display); font-size: 15px; }
.slot .sr { font-family: var(--f-num); font-size: 13px; color: var(--muted); }
.slot.empty { justify-content: center; color: var(--muted); font-size: 13px; font-style: italic; }
.slot.empty::before { content: ""; width: 56px; height: 56px; border-radius: 50%; border: 1px dashed var(--line); margin-bottom: 10px; }

footer { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-style: italic; }
footer button { font-size: 12px; padding: 2px 8px; font-style: normal; }

.ending { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); display: grid; place-items: center; padding: 16px; z-index: 20; }
.ending .card { max-width: 480px; background: var(--bg); border: 2px solid var(--ink); outline: 1px solid var(--ink); outline-offset: -7px; padding: 30px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 18px 40px -24px rgba(10, 14, 22, .55); }
.ending h2 { font-size: 26px; letter-spacing: .06em; }
.ending p { margin: 0; }
.ending .big { font-family: var(--f-num); font-size: 34px; }
.ending .actions { justify-content: flex-start; }

@media (max-width: 860px) {
  /* on a phone the callouts would push the angle scale off screen; it needs to sit right under the gem */
  .bench.angling .callouts { display: none; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .grid > .bench { padding-right: 0; position: static; }
  .grid > .side { padding-left: 0; border-left: 0; border-top: 1px solid var(--ink); margin-top: 18px; padding-top: 18px; }
  .row-btns { flex-basis: 100%; }
  .top { grid-template-columns: 1fr auto; }
  .brand { grid-column: 1 / -1; grid-row: 2; }
  .plate-no { align-self: center; }
}
@media (max-width: 560px) {
  .specimen { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .stage-wrap { grid-column: 1 / -1; grid-row: 1; }
  .callouts { gap: 10px; }
  .callout { flex-direction: column !important; align-items: center; gap: 4px; text-align: center !important; }
  .callout .cv { align-items: center !important; }
  .callout .lead { order: -1; flex: none; width: 1px; height: 16px; min-width: 0; }
  .callouts .lead::after { left: -2px; right: auto; top: -2px; }
  #benchCv { width: min(78vw, 300px); }
  .plate-in { padding: 14px; }
}
/* one screen whenever the window is tall enough: the bench never leaves view, the legend and the case are three tabs,
   and only a tab's own list scrolls. Phones stack bench over tabs; wide screens put the tabs in a column beside the bench */
.tabs { display: none; }
.goal { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-family: var(--f-num); font-style: italic; font-size: 13px; color: var(--muted); }
.goal-bar { flex: 1 1 60px; height: 3px; background: var(--line); position: relative; min-width: 40px; }
.goal-bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); width: 0; transition: width .25s cubic-bezier(.16, 1, .3, 1); }

/* ---------- loop ---------- */
let last = performance.now(), uiAcc = 0, frame = 0, saveAcc = 0;
function step(now) {
  if (!live()) { try { snd.ctx && snd.ctx.close(); } catch (e) {} return; }
  const dt = Math.min(5, (now - last) / 1000); last = now; frame++;
  simulate(dt);
  swingNeedle(Math.min(dt, 0.05));
  const time = now / 1000;
  if (frame % 60 === 1) readTheme();
  particles = particles.filter(p => (p.life -= dt) > 0);
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.12; }
  const b = S.bench;
  if (b) drawScene(benchCx, b, b.stage, b.stage === 'rock' ? 1 - b.hp / b.hpMax : 1, time, particles);
  else { benchCx.clearRect(0, 0, 128, 150); }
  if (unlockGem && !$('unlock').hidden) drawScene($('unlockCv').getContext('2d'), unlockGem, 'done', 1, time);
  if (frame % 3 === 0) {
    $('caseGrid').querySelectorAll('canvas').forEach(cv => {
      const g = S.cases[+cv.dataset.i]; if (g) drawScene(cv.getContext('2d'), g, 'done', 1, time + g.seed % 10);
    });
  }
  uiAcc += dt;
  if (uiAcc > 0.12) { uiAcc = 0; renderTop(); renderSide(); renderBench(); renderCase(); fitBench(); }
  saveAcc += dt; if (saveAcc > 5) { saveAcc = 0; save(); }
  requestAnimationFrame(step);
}
function simulate(dt) {
  const r = totalRate();
  S.light += r * dt; S.total += r * dt;
  for (const g of S.cases) if (g.t === 'tourmaline') g.dust = Math.min(1, (g.dust || 0) + dt / dustTime());
  const b = S.bench, ag = autoGrind();
  if (b && ag) {
    if (b.stage === 'rock') { b.hp -= ag * 0.5 * dt; if (b.hp <= 0) breakRock(); }
    else if (b.stage === 'facet') addGrind(ag * dt);
  }
}
let lastLight = '';
function renderTop() {
  const s = fmt(S.light);
  if (s !== lastLight) {
    lastLight = s;
    $('light').innerHTML = $('rhLight').innerHTML = [...s].map(ch => `<span class="${/[0-9A-Za-z]/.test(ch) ? 'd' : /[.,]/.test(ch) ? 'p' : 'w'}">${ch}</span>`).join('');
  }
  $('rate').textContent = $('rhRate').textContent = `+${fmt(totalRate())} ${tr('perSec')}`;
  // always one thing to work toward: the next stone to appear, then the next stone to afford
  const rate = totalRate(), soon = rate > 0 && SHOP.filter(s => isUnlocked(s) && S.light < priceOf(s.k) && (priceOf(s.k) - S.light) / rate <= 60)
    .sort((a, b) => priceOf(a.k) - priceOf(b.k))[0];
  const lock = !soon && SHOP.find(s => !isUnlocked(s)), want = soon || (!lock && SHOP.find(s => !S.bought[s.k]));
  const eta = left => { const r = totalRate(); if (r <= 0) return ''; const t = left / r;
    return tr('eta', t < 60 ? tr('etaS', Math.ceil(t)) : t < 3600 ? tr('etaM', Math.ceil(t / 60)) : tr('etaH', (t / 3600).toFixed(1))); };
  const need = lock ? lock.price * 0.25 : want ? priceOf(want.k) : 0, have = lock ? S.total : S.light, left = need - have;
  const g = lock ? [tr('goalLocked', fmt(left)) + eta(left), have / need]
    : want ? [left > 0 ? tr('goalBuy', L().shop[want.k].title, fmt(left)) + eta(left) : tr('goalReady', L().shop[want.k].title), have / need] : null;
  $('goal').hidden = !g;
  if (g) { $('goalText').textContent = g[0]; $('goalFill').style.width = Math.min(100, g[1] * 100).toFixed(1) + '%'; }
}
function renderAll() { renderTop(); renderSide(); renderBench(); renderCase(); }

/* ---------- persistence ---------- */
function save() { if (!live()) return; S.t = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (!data) return false;
  S = Object.assign(fresh(), data, { up: Object.assign(fresh().up, data.up), bought: Object.assign(fresh().bought, data.bought) });
  ensureTut();
  if (!data.unlocked) seedUnlocked();
  // no offline income: light only gathers while the page is open, so a forgotten tab never returns with an absurd balance
  return true;
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
if ('IntersectionObserver' in window) new IntersectionObserver(([e]) => {
  if (!live()) return;
  const on = !e.isIntersecting && e.boundingClientRect.top < 0, rh = $('runhead');
  rh.classList.toggle('on', on);
  document.documentElement.style.setProperty('--rh', on ? rh.offsetHeight + 'px' : '0px');
}).observe(document.querySelector('.meter .meter-row'));

/* ---------- wiring ---------- */
benchCv.addEventListener('pointerdown', e => { e.preventDefault(); hitBench(); });
benchCv.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hitBench(); } });
$('shop').addEventListener('click', e => { const b = e.target.closest('button[data-buy]'); if (b) buy(b.dataset.buy); });
$('ups').addEventListener('click', e => { const b = e.target.closest('button[data-up]'); if (b) upgrade(b.dataset.up); });
$('caseGrid').addEventListener('click', e => { const b = e.target.closest('.slot')?.querySelector('button[data-wipe]:not(.off)'); if (b && live()) wipe(+b.dataset.wipe); });
$('langBtn').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  try { localStorage.setItem('canguang-lang', LANG); } catch (e) {}
  applyLang();
});
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = tr('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', tr(el.dataset.i18nAria)));
  $('langBtn').textContent = tr('langBtn');
  $('gaugeTip').textContent = tr($('gaugeTip').classList.contains('now') ? 'gaugeNow' : 'gaugeIdle');
  buildShop(); caseKey = ''; $('benchActions').dataset.html = '';
  renderSoundBtn(); renderAll(); drawAngle();
}
$('unlockGo').addEventListener('click', () => {
  $('unlock').hidden = true; clearTimeout(unlockTimer);
  if (SHELL.matches) setTab('shop', true);
  if (unlockRow) unlockRow.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' });
});
$('gaugeCv').addEventListener('pointerdown', e => { e.preventDefault(); lockAngle(); });
$('angleMore').addEventListener('toggle', drawAngle);
angleCv.addEventListener('pointerdown', e => { e.preventDefault(); lockAngle(); });
addEventListener('keydown', e => {
  if (!live()) return;
  if (e.key !== ' ' || !S.bench || S.bench.stage !== 'angle') return;
  if (e.target.closest && e.target.closest('button, input')) return;
  e.preventDefault(); lockAngle();
});
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b && live()) setTab(b.dataset.tab, true); });
['shop', 'ups'].forEach(id => $(id).addEventListener('click', e => {
  if (!live() || !SHELL.matches || e.target.closest('button')) return;
  const row = e.target.closest('.row'); if (row) row.classList.toggle('open');
}));
$('ticker').addEventListener('click', () => { if (live() && SHELL.matches) $('ticker').classList.toggle('open'); });
addEventListener('resize', () => { if (live()) fitShell(); });
SHELL.addEventListener('change', () => { if (live()) { fitShell(); renderAll(); drawAngle(); } });
$('endClose').addEventListener('click', () => { $('ending').hidden = true; });
$('resetBtn').addEventListener('click', () => { $('resetConfirm').hidden = false; $('resetBtn').hidden = true; });
$('resetNo').addEventListener('click', () => { $('resetConfirm').hidden = true; $('resetBtn').hidden = false; });
$('resetYes').addEventListener('click', () => {
  S = fresh(); try { localStorage.removeItem(KEY); } catch (e) {}
  S.bought.fluorite = 1; S.bench = newGem('fluorite');
  $('resetConfirm').hidden = true; $('resetBtn').hidden = false; caseKey = '';
  say(tr('restart'), false); renderAll();
});
addEventListener('resize', drawAngle);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); drawAngle(); });
new MutationObserver(() => { readTheme(); drawAngle(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function start(data) {
  if (data && typeof data.light === 'number') { S = data; ensureTut(); if (!S.unlocked) seedUnlocked(); }
  else if (!load()) {
    S.bought.fluorite = 1; S.bench = newGem('fluorite');
    say(tr('welcome'), false);
  }
  window.claude?.hot?.snapshot?.(() => S);
  fitShell(); setTab(tab);
  readTheme(); applyLang();
  requestAnimationFrame(t => { last = t; step(t); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</html>
